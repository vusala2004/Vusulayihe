<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations - Brûlé Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <h1 class="text-center">Table Reservation</h1>

        <div class="grid grid-2 gap-3">
          <!-- Reservation Form -->
          <div>
            <div class="card">
              <div class="card-content">
                <h3>Make a Reservation</h3>
                <form id="reservation-form">
                  <div class="form-group">
                    <label for="res-name">Full Name *</label>
                    <input type="text" id="res-name" required>
                  </div>

                  <div class="form-group">
                    <label for="res-email">Email *</label>
                    <input type="email" id="res-email" required>
                  </div>

                  <div class="form-group">
                    <label for="res-phone">Phone *</label>
                    <input type="tel" id="res-phone" required>
                  </div>

                  <div class="form-group">
                    <label for="res-date">Date *</label>
                    <input type="date" id="res-date" required min="">
                  </div>

                  <div class="form-group">
                    <label for="res-time">Time *</label>
                    <select id="res-time" required>
                      <option value="">Select time</option>
                      <option value="08:00">8:00 AM</option>
                      <option value="08:30">8:30 AM</option>
                      <option value="09:00">9:00 AM</option>
                      <option value="09:30">9:30 AM</option>
                      <option value="10:00">10:00 AM</option>
                      <option value="10:30">10:30 AM</option>
                      <option value="11:00">11:00 AM</option>
                      <option value="11:30">11:30 AM</option>
                      <option value="12:00">12:00 PM</option>
                      <option value="12:30">12:30 PM</option>
                      <option value="13:00">1:00 PM</option>
                      <option value="13:30">1:30 PM</option>
                      <option value="14:00">2:00 PM</option>
                      <option value="14:30">2:30 PM</option>
                      <option value="15:00">3:00 PM</option>
                      <option value="15:30">3:30 PM</option>
                      <option value="16:00">4:00 PM</option>
                      <option value="16:30">4:30 PM</option>
                      <option value="17:00">5:00 PM</option>
                      <option value="17:30">5:30 PM</option>
                      <option value="18:00">6:00 PM</option>
                      <option value="18:30">6:30 PM</option>
                      <option value="19:00">7:00 PM</option>
                      <option value="19:30">7:30 PM</option>
                      <option value="20:00">8:00 PM</option>
                      <option value="20:30">8:30 PM</option>
                      <option value="21:00">9:00 PM</option>
                      <option value="21:30">9:30 PM</option>
                      <option value="22:00">10:00 PM</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="res-guests">Number of Guests *</label>
                    <select id="res-guests" required>
                      <option value="">Select guests</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="5">5</option>
                      <option value="6">6</option>
                      <option value="7">7</option>
                      <option value="8">8</option>
                      <option value="9">9</option>
                      <option value="10">10</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="res-requests">Special Requests</label>
                    <textarea id="res-requests" rows="3" placeholder="Any special requests or dietary requirements..."></textarea>
                  </div>

                  <button type="submit" class="btn btn-full">Reserve Table</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Existing Reservations -->
          <div>
            <div class="card">
              <div class="card-content">
                <h3>Your Reservations</h3>
                <div id="reservations-list">
                  <!-- Reservations will be loaded here -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Set min date to today
    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('res-date').min = today;
      loadReservations();
    });

    // Load reservations
    function loadReservations() {
      const reservations = JSON.parse(localStorage.getItem('brule_reservations') || '[]');
      const container = document.getElementById('reservations-list');

      if (reservations.length === 0) {
        container.innerHTML = '<p>No reservations yet.</p>';
        return;
      }

      container.innerHTML = reservations.map((res, index) => `
        <div class="card mb-2">
          <div class="card-content">
            <div class="flex justify-between">
              <div>
                <h4>${res.name}</h4>
                <p>${res.date} at ${res.time}</p>
                <p>${res.guests} guests</p>
                ${res.requests ? `<p><em>${res.requests}</em></p>` : ''}
              </div>
              <button class="btn btn-secondary cancel-reservation" data-index="${index}">Cancel</button>
            </div>
          </div>
        </div>
      `).join('');

      // Add cancel event listeners
      document.querySelectorAll('.cancel-reservation').forEach(btn => {
        btn.addEventListener('click', function() {
          const index = parseInt(this.dataset.index);
          cancelReservation(index);
        });
      });
    }

    // Cancel reservation
    function cancelReservation(index) {
      const reservations = JSON.parse(localStorage.getItem('brule_reservations') || '[]');
      reservations.splice(index, 1);
      localStorage.setItem('brule_reservations', JSON.stringify(reservations));
      loadReservations();
      showToast('Reservation cancelled', 'info');
    }

    // Form submit
    document.getElementById('reservation-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const reservation = {
        name: document.getElementById('res-name').value,
        email: document.getElementById('res-email').value,
        phone: document.getElementById('res-phone').value,
        date: document.getElementById('res-date').value,
        time: document.getElementById('res-time').value,
        guests: document.getElementById('res-guests').value,
        requests: document.getElementById('res-requests').value,
        timestamp: new Date().toISOString()
      };

      const reservations = JSON.parse(localStorage.getItem('brule_reservations') || '[]');
      reservations.push(reservation);
      localStorage.setItem('brule_reservations', JSON.stringify(reservations));

      showToast('Reservation confirmed!', 'success');
      this.reset();
      loadReservations();
    });
  </script>
</body>
</html>
