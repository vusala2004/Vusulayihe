<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Brûlé Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <h1 class="text-center">Shopping Cart</h1>

        <div id="cart-content">
          <!-- Cart items or empty state will be loaded here -->
        </div>

        <div id="order-summary" class="hidden">
          <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <div class="card-content">
              <h3>Order Summary</h3>
              <p>Subtotal: $<span id="subtotal">0.00</span></p>
              <p>Delivery Fee: $3.00</p>
              <p><strong>Total: $<span id="total">3.00</span></strong></p>
              <a href="checkout.html" class="btn btn-full">Proceed to Checkout</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Render cart
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-content');
      const summary = document.getElementById('order-summary');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center">
            <h2>Your cart is empty</h2>
            <p>Add some delicious items from our menu!</p>
            <a href="menu.html" class="btn">Browse Menu</a>
          </div>
        `;
        summary.classList.add('hidden');
        return;
      }

      summary.classList.remove('hidden');

      container.innerHTML = `
        <div class="grid grid-1" style="gap: 1rem;">
          ${cart.map((item, index) => `
            <div class="card">
              <div class="card-content">
                <div class="flex gap-2 align-center">
                  <img src="${item.image}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 5px;">
                  <div style="flex: 1;">
                    <h3>${item.name}</h3>
                    <p>Size: ${item.size}</p>
                    <p>Price: $${item.price.toFixed(2)}</p>
                  </div>
                  <div class="flex align-center gap-1">
                    <button class="btn btn-secondary qty-btn" data-index="${index}" data-action="decrease">-</button>
                    <span>${item.quantity}</span>
                    <button class="btn btn-secondary qty-btn" data-index="${index}" data-action="increase">+</button>
                  </div>
                  <div>
                    <p><strong>$${(item.price * item.quantity).toFixed(2)}</strong></p>
                    <button class="btn btn-secondary remove-btn" data-index="${index}" style="margin-top: 0.5rem;">Remove</button>
                  </div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      // Update summary
      const subtotal = getTotal();
      const deliveryFee = 3.00;
      const total = subtotal + deliveryFee;

      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);

      // Add event listeners
      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const index = parseInt(this.dataset.index);
          const action = this.dataset.action;
          const item = cart[index];
          if (action === 'increase') {
            updateQty(item.id, item.size, item.quantity + 1);
          } else if (action === 'decrease' && item.quantity > 1) {
            updateQty(item.id, item.size, item.quantity - 1);
          }
          renderCart();
          updateCartBadge();
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const index = parseInt(this.dataset.index);
          const item = cart[index];
          removeItem(item.id, item.size);
          renderCart();
          updateCartBadge();
          showToast('Item removed from cart', 'info');
        });
      });
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
