<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Last Summer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <h1 class="text-center">Our Menu</h1>

        <!-- Filters and Search -->
        <div class="flex justify-center gap-3 mb-3 flex-column" style="align-items: stretch;">
          <div class="flex gap-2" style="flex-wrap: wrap; justify-content: center;">
            <button class="btn btn-secondary category-filter active" data-category="All">All</button>
            <button class="btn btn-secondary category-filter" data-category="Espresso">Espresso</button>
            <button class="btn btn-secondary category-filter" data-category="Cold Brew">Cold Brew</button>
            <button class="btn btn-secondary category-filter" data-category="Tea">Tea</button>
            <button class="btn btn-secondary category-filter" data-category="Pastries">Pastries</button>
            <button class="btn btn-secondary category-filter" data-category="Seasonal">Seasonal</button>
          </div>
          <div class="flex gap-2" style="max-width: 600px; margin: 0 auto;">
            <input type="text" id="search-input" placeholder="Search products..." style="flex: 1; padding: 0.75rem; border-radius: 5px; border: 1px solid var(--sand);">
            <select id="sort-select" style="padding: 0.75rem; border-radius: 5px; border: 1px solid var(--sand);">
              <option value="popular">Popular</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
            </select>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="grid grid-4" id="products-grid">
          <!-- Products will be loaded here -->
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentCategory = 'All';
    let currentSort = 'popular';
    let searchQuery = '';

    // Render products
    function renderProducts() {
      let filteredProducts = getProductsByCategory(currentCategory);
      if (searchQuery) {
        filteredProducts = searchProducts(searchQuery);
      }
      filteredProducts = sortProducts(filteredProducts, currentSort);

      const container = document.getElementById('products-grid');
      container.innerHTML = filteredProducts.map(product => `
        <div class="card">
          <img src="${product.image}" alt="${product.name}">
          <div class="card-content">
            <h3>${product.name}</h3>
            <p>${product.description}</p>
            <p class="mb-2"><strong>$${product.price.toFixed(2)}</strong></p>
            <div class="flex gap-1">
              <a href="product.html?id=${product.id}" class="btn" style="flex: 1;">View</a>
              <button class="btn btn-secondary add-to-cart" data-id="${product.id}" style="flex: 1;">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');

      // Add event listeners for add to cart
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', function() {
          const productId = parseInt(this.dataset.id);
          addItem(productId);
          updateCartBadge();
          showToast('Added to cart!', 'success');
        });
      });
    }

    // Category filter
    document.querySelectorAll('.category-filter').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.category-filter').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        renderProducts();
      });
    });

    // Search
    document.getElementById('search-input').addEventListener('input', function() {
      searchQuery = this.value;
      renderProducts();
    });

    // Sort
    document.getElementById('sort-select').addEventListener('change', function() {
      currentSort = this.value;
      renderProducts();
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', renderProducts);
  </script>
</body>
</html>
