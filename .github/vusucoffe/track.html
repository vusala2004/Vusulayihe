<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - Brûlé Coffee</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin: 2rem 0;
      position: relative;
    }
    .progress-bar::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--sand);
      z-index: 1;
    }
    .progress-line {
      position: absolute;
      top: 50%;
      left: 0;
      height: 2px;
      background: var(--gold);
      z-index: 2;
      transition: width 1s ease;
    }
    .step {
      background: white;
      border: 2px solid var(--sand);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      position: relative;
      transition: all 0.5s ease;
    }
    .step.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--espresso);
    }
    .step.completed {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--espresso);
    }
    .step-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    .countdown {
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold);
      text-align: center;
      margin: 2rem 0;
    }
    .map-placeholder {
      width: 100%;
      height: 300px;
      background: var(--sand);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 2rem;
    }
    .map-pin {
      font-size: 3rem;
      color: var(--rust);
    }
  </style>
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <h1 class="text-center">Track Your Order</h1>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <div class="card-content">
            <div class="progress-bar">
              <div class="progress-line" id="progress-line"></div>
              <div class="step active" id="step-1">1</div>
              <div class="step" id="step-2">2</div>
              <div class="step" id="step-3">3</div>
              <div class="step" id="step-4">4</div>
            </div>
            <div class="grid grid-4">
              <div class="step-text">Order Received</div>
              <div class="step-text">Preparing</div>
              <div class="step-text">Ready</div>
              <div class="step-text">Delivered</div>
            </div>

            <div class="countdown" id="countdown">00:00</div>

            <div class="map-placeholder">
              <div class="map-pin">📍</div>
              <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 0.5rem; border-radius: 5px;">
                Estimated delivery location
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentStep = 1;
    let countdownInterval = null;
    let timeLeft = 35 * 60; // 35 minutes in seconds

    // Animate progress
    function animateProgress(targetStep) {
      const progressLine = document.getElementById('progress-line');
      const percentage = ((targetStep - 1) / 3) * 100;
      progressLine.style.width = percentage + '%';

      for (let i = 1; i <= 4; i++) {
        const step = document.getElementById('step-' + i);
        if (i < targetStep) {
          step.classList.add('completed');
          step.classList.remove('active');
        } else if (i === targetStep) {
          step.classList.add('active');
          step.classList.remove('completed');
        } else {
          step.classList.remove('active', 'completed');
        }
      }
    }

    // Update countdown
    function updateCountdown() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('countdown').textContent = 
        String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

      if (timeLeft > 0) {
        timeLeft--;
      } else {
        clearInterval(countdownInterval);
        // Advance to next step
        if (currentStep < 4) {
          currentStep++;
          animateProgress(currentStep);
          // Reset time for next step
          timeLeft = Math.floor(Math.random() * 10 + 5) * 60; // 5-15 minutes
          countdownInterval = setInterval(updateCountdown, 1000);
        }
      }
    }

    // Simulate order tracking
    function startTracking() {
      // Start with step 1
      animateProgress(1);
      countdownInterval = setInterval(updateCountdown, 1000);

      // Simulate progression
      setTimeout(() => {
        currentStep = 2;
        animateProgress(2);
        timeLeft = Math.floor(Math.random() * 10 + 10) * 60; // 10-20 minutes
      }, 5000); // After 5 seconds

      setTimeout(() => {
        currentStep = 3;
        animateProgress(3);
        timeLeft = Math.floor(Math.random() * 5 + 5) * 60; // 5-10 minutes
      }, 15000); // After 15 seconds

      setTimeout(() => {
        currentStep = 4;
        animateProgress(4);
        clearInterval(countdownInterval);
        document.getElementById('countdown').textContent = 'Delivered!';
      }, 25000); // After 25 seconds
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', function() {
      // Check if there's an active order
      const orders = JSON.parse(localStorage.getItem('brule_orders') || '[]');
      const activeOrder = orders.find(order => ['pending', 'preparing', 'ready'].includes(order.status));

      if (!activeOrder) {
        // Show message or redirect
        document.querySelector('.card-content').innerHTML = `
          <h3>No active orders</h3>
          <p>You don't have any orders currently being prepared.</p>
          <a href="menu.html" class="btn">Order Now</a>
        `;
        return;
      }

      startTracking();
    });
  </script>
</body>
</html>
