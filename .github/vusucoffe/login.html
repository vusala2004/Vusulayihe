<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Brûlé Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <div class="card" style="max-width: 400px; margin: 0 auto;">
          <div class="card-content">
            <div class="flex mb-3">
              <button class="btn tab-btn active" id="login-tab">Login</button>
              <button class="btn tab-btn" id="register-tab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="form">
              <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
              </div>

              <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
              </div>

              <div class="form-group">
                <label>
                  <input type="checkbox" id="remember-me"> Remember me
                </label>
              </div>

              <button type="submit" class="btn btn-full">Login</button>

              <p class="text-center mt-2">
                <a href="#" id="forgot-password">Forgot password?</a>
              </p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="form hidden">
              <div class="form-group">
                <label for="register-name">Full Name</label>
                <input type="text" id="register-name" required>
              </div>

              <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required>
              </div>

              <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" required minlength="6">
              </div>

              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required>
              </div>

              <button type="submit" class="btn btn-full">Register</button>
            </form>

            <hr style="margin: 2rem 0;">

            <button class="btn btn-secondary btn-full" id="google-signin">
              🔵 Continue with Google
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Tab switching
    document.getElementById('login-tab').addEventListener('click', function() {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      this.classList.add('active');
      document.getElementById('register-tab').classList.remove('active');
    });

    document.getElementById('register-tab').addEventListener('click', function() {
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('login-form').classList.add('hidden');
      this.classList.add('active');
      document.getElementById('login-tab').classList.remove('active');
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (login(email, password)) {
        showToast('Login successful!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        showToast('Invalid email or password', 'error');
      }
    });

    // Register form
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Validation
      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      if (register(name, email, password)) {
        showToast('Registration successful!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        showToast('Email already registered', 'error');
      }
    });

    // Forgot password (placeholder)
    document.getElementById('forgot-password').addEventListener('click', function(e) {
      e.preventDefault();
      showToast('Password reset feature coming soon!', 'info');
    });

    // Google sign-in (placeholder)
    document.getElementById('google-signin').addEventListener('click', function() {
      showToast('Google sign-in not implemented yet', 'info');
    });

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', function() {
      if (getCurrentUser()) {
        window.location.href = 'profile.html';
      }
    });
  </script>
</body>
</html>
