<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Brûlé Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container">
        <h1 class="text-center">My Profile</h1>

        <div class="grid grid-2 gap-3">
          <!-- Profile Info -->
          <div>
            <div class="card">
              <div class="card-content text-center">
                <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--espresso); margin: 0 auto 1rem;">
                  <span id="avatar-initials"></span>
                </div>
                <h3 id="user-name"></h3>
                <p id="user-email"></p>

                <div class="mt-3">
                  <h4>Loyalty Points</h4>
                  <p style="font-size: 2rem; color: var(--gold); font-weight: bold;" id="loyalty-points">0</p>
                  <p>Points earned from orders</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Edit Profile -->
          <div>
            <div class="card">
              <div class="card-content">
                <h3>Edit Profile</h3>
                <form id="profile-form">
                  <div class="form-group">
                    <label for="edit-name">Full Name</label>
                    <input type="text" id="edit-name" required>
                  </div>

                  <div class="form-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" required>
                  </div>

                  <div class="form-group">
                    <label for="edit-phone">Phone</label>
                    <input type="tel" id="edit-phone">
                  </div>

                  <div class="form-group">
                    <label for="edit-birthday">Birthday</label>
                    <input type="date" id="edit-birthday">
                  </div>

                  <button type="submit" class="btn btn-full">Update Profile</button>
                </form>

                <button class="btn btn-secondary btn-full mt-2" onclick="logout()">Logout</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Order History -->
        <div class="card mt-3">
          <div class="card-content">
            <h3>Order History</h3>
            <div id="order-history">
              <!-- Orders will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Require authentication
    if (!requireAuth()) return;

    const user = getCurrentUser();

    // Load profile data
    function loadProfile() {
      document.getElementById('avatar-initials').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-email').textContent = user.email;

      document.getElementById('edit-name').value = user.name || '';
      document.getElementById('edit-email').value = user.email || '';
      document.getElementById('edit-phone').value = user.phone || '';
      document.getElementById('edit-birthday').value = user.birthday || '';

      // Calculate loyalty points
      const orders = JSON.parse(localStorage.getItem('brule_orders') || '[]');
      const userOrders = orders.filter(order => order.email === user.email);
      const points = userOrders.length * 10;
      document.getElementById('loyalty-points').textContent = points;
    }

    // Load order history
    function loadOrderHistory() {
      const orders = JSON.parse(localStorage.getItem('brule_orders') || '[]');
      const userOrders = orders.filter(order => order.email === user.email);

      const container = document.getElementById('order-history');

      if (userOrders.length === 0) {
        container.innerHTML = '<p>No orders yet.</p>';
        return;
      }

      container.innerHTML = userOrders.map(order => `
        <div class="card mb-2">
          <div class="card-content">
            <div class="flex justify-between">
              <div>
                <h4>Order #${order.orderNumber}</h4>
                <p>${new Date(order.timestamp).toLocaleDateString()}</p>
                <p>Status: ${order.status}</p>
              </div>
              <div class="text-right">
                <p><strong>$${order.total.toFixed(2)}</strong></p>
                <p>${order.cart.length} items</p>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Update profile
    document.getElementById('profile-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const updates = {
        name: document.getElementById('edit-name').value,
        email: document.getElementById('edit-email').value,
        phone: document.getElementById('edit-phone').value,
        birthday: document.getElementById('edit-birthday').value
      };

      if (updateUser(updates)) {
        showToast('Profile updated!', 'success');
        loadProfile();
      } else {
        showToast('Failed to update profile', 'error');
      }
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();
      loadOrderHistory();
    });
  </script>
</body>
</html>
